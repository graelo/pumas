# Compatibility testing: multi-version matrix on macOS.
#
# Pumas is Apple-Silicon-only (uses macOS `powermetrics`), so the standard
# `test-platforms` job would collapse to a single row identical to
# `ci-essentials.yml` and is omitted here. Only `test-rust-versions` runs,
# pinned to `macos-latest` because the crate does not compile on Linux.
#
# Local:
#   act push -W .github/workflows/ci-compatibility-matrix.yml -j test-rust-versions

name: 'CI: Compatibility Matrix'

on:
  push:
    branches:
      - 'compat/*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-rust-versions:
    runs-on: macos-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.95.0', beta, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Quality – cargo fmt
        run: |
          cargo fmt --all -- --check

      - name: Quality – cargo clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build (dev)
        run: cargo build --locked

      - name: Build (release)
        run: cargo build --locked --release

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9.133

      - name: Test
        run: ./ci/test_full.sh
